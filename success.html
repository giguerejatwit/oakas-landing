<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to OAKAS</title>
<link rel="icon" href="favicon.ico">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0a0a0a; color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 40px 20px;
  }
  .container {
    text-align: center;
    max-width: 440px;
  }
  .logo {
    height: 80px;
    margin-bottom: 32px;
    object-fit: contain;
  }
  h1 {
    font-size: 32px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 16px;
  }
  .subtitle {
    font-size: 18px;
    color: #22c55e;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<div class="container">
  <img src="logo_bw.png" alt="OAKAS" class="logo">
  <h1>Welcome to OAKAS</h1>
  <p class="subtitle">Check your WhatsApp 🌳</p>
</div>
</body>
</html>
