<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0a0a0a; color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 40px 20px;
  }
  .container {
    text-align: center;
    max-width: 480px;
  }
  .logo {
    height: 80px;
    margin-bottom: 32px;
    object-fit: contain;
  }
  h1 {
    font-size: 32px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 12px;
  }
  .subtitle {
    font-size: 18px;
    color: #22c55e;
    font-weight: 600;
    margin-bottom: 40px;
  }
  .steps {
    text-align: left;
    margin-bottom: 32px;
  }
  .step {
    display: flex;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid #1a1a1a;
  }
  .step:last-child { border-bottom: none; }
  .step-num {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #22c55e;
    color: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 800;
    flex-shrink: 0;
  }
  .step-text {
    font-size: 15px;
    color: #ccc;
    line-height: 1.5;
  }
  .step-text strong { color: #fff; }
</style>

<body>
<div class="container">
  <img src="logo_bw.png" alt="OAKAS" class="logo">
  <h1>Welcome to OAKAS</h1>
  <p class="subtitle">Check your WhatsApp</p>
  <div class="steps">
    <div class="step">
      <span class="step-num">1</span>
      <span class="step-text"><strong>Open WhatsApp</strong> — you'll have a message from your new AI assistant.</span>
    </div>
    <div class="step">
      <span class="step-num">2</span>
      <span class="step-text"><strong>Tell it about your business</strong> — what you do, your services, your rates.</span>
    </div>
    <div class="step">
      <span class="step-num">3</span>
      <span class="step-text"><strong>Start using it</strong> — send invoices, schedule jobs, track expenses. Just text like you're talking to a real assistant.</span>
    </div>
  </div>
</div>
</body>
