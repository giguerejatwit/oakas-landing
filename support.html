<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support — OAKAS</title>
<link rel="icon" href="favicon.ico">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a; color: #ccc;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 60px 20px;
    line-height: 1.6;
    min-height: 100vh;
  }
  .container { max-width: 560px; margin: 0 auto; }
  a { color: #40916C; text-decoration: none; }
  a:hover { text-decoration: underline; }
  h1 { color: #fff; font-size: 32px; margin-bottom: 8px; }
  .subtitle { color: #888; font-size: 15px; margin-bottom: 40px; }
  label {
    display: block; color: #fff; font-size: 14px;
    margin-bottom: 8px; margin-top: 20px; font-weight: 500;
  }
  input, textarea, select {
    width: 100%;
    background: #151515;
    border: 1px solid #2a2a2a;
    color: #fff;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    transition: border-color 0.15s;
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: #40916C;
  }
  textarea { min-height: 140px; resize: vertical; }
  button {
    width: 100%;
    background: #40916C;
    color: #000;
    border: none;
    padding: 14px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 28px;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(64,145,108,0.35); }
  button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .back { display: inline-block; margin-top: 32px; color: #40916C; font-size: 14px; }
  .direct {
    margin-top: 32px; padding: 16px; background: #131313;
    border: 1px solid #222; border-radius: 8px;
    font-size: 14px; color: #888;
  }
  .direct strong { color: #fff; }
</style>
</head>
<body>
<div class="container">
  <h1>Contact Support</h1>
  <p class="subtitle">Send us a message and we'll get back to you within one business day.</p>

  <form id="supportForm" onsubmit="handleSupportSubmit(event)">
    <label for="name">Your name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="subject">Subject</label>
    <input type="text" id="subject" name="subject" required>

    <label for="message">How can we help?</label>
    <textarea id="message" name="message" required></textarea>

    <button type="submit" id="submitBtn">Send Message</button>
  </form>

  <div class="direct">
    Prefer email? Reach us directly at <strong><a href="mailto:support@oakas.ai">support@oakas.ai</a></strong>
    <br>Or call us at <strong><a href="tel:+16173137925">(617) 313-7925</a></strong>
  </div>

  <a href="/" class="back">← Back to home</a>
</div>

<script>
function handleSupportSubmit(e) {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const form = e.target;
  const data = {
    type: 'support',
    to: 'support@oakas.ai',
    name: document.getElementById('name').value,
    email: document.getElementById('email').value,
    subject: document.getElementById('subject').value,
    message: document.getElementById('message').value
  };
  btn.textContent = 'Sending...';
  btn.disabled = true;
  fetch('https://script.google.com/macros/s/AKfycbzXIhkWP3JxTXVTq4u8btG-xvVK1NM1X0phCSTiMw0VJZpo7y2k4mnZXodGtyqX84BdXQ/exec', {
    method: 'POST', mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  }).then(() => {
    btn.textContent = '✓ Message sent!';
    form.reset();
    setTimeout(() => { btn.textContent = 'Send Message'; btn.disabled = false; }, 3000);
  }).catch(() => {
    btn.textContent = '✓ Message sent!';
    form.reset();
    setTimeout(() => { btn.textContent = 'Send Message'; btn.disabled = false; }, 3000);
  });
}
</script>
</body>
</html>
